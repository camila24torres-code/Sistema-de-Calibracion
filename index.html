<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco de Pruebas y Monitoreo en Tuberías</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #121212;
      color: #dadada;
      display: flex;
      flex-direction: row;
      height: 100vh;
    }

    /* Encabezado superior */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background-color: #ad3333;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 4px solid #003366;
      z-index: 1000;
    }

    header img {
      height: 50px;
      margin-right: 15px;
    }

    header h1 {
      font-size: 22px;
      color: #fff;
      margin: 0;
    }

    /* Sidebar izquierdo */
    .sidebar {
      position: fixed;
      top: 70px;
      left: 0;
      width: 280px;
      bottom: 0;
      background-color: #1e1e1e;
      padding: 15px;
      border-right: 2px solid #003366;
      overflow-y: auto;
    }

    .sidebar h2 {
      text-align: center;
      color: #ad3333;
      margin-bottom: 10px;
    }

    .sensor-card {
      background-color: #2a2a2a;
      border-left: 4px solid #ad3333;
      padding: 8px 10px;
      margin: 6px 0;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .flow-box {
      background-color: #003366;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-size: 16px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      background-color: #ad3333;
      color: white;
      border: none;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 15px;
    }

    button:hover {
      background-color: #861f1f;
    }

    /* Contenedor principal */
    .main {
      margin-left: 280px;
      padding: 90px 20px 20px 20px;
      width: calc(100% - 280px);
      overflow-y: auto;
    }

    .chart-container {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px #00000066;
    }

    footer {
      text-align: center;
      color: #dadada;
      padding: 15px;
      font-size: 14px;
      border-top: 2px solid #003366;
      background-color: #1e1e1e;
    }
  </style>
</head>
<body>
  <header>
    <img src="unipamplona_64.png" alt="Logo Unipamplona" />
    <h1>Banco de Pruebas y Monitoreo en Tuberías</h1>
  </header>

  <aside class="sidebar">
    <h2>Lecturas en tiempo real</h2>
    <div id="pressureReadings"></div>
    <div class="flow-box" id="flowFS">Caudal FS300A: 0 L/h</div>
    <div class="flow-box" id="flowYF">Caudal YF-S201: 0 L/min</div>
    <button onclick="downloadCSV()">Descargar CSV</button>
    <button onclick="calibrateSensors()">Calibrar Sensores</button>
  </aside>

  <div class="main">
    <div class="chart-container">
      <div id="pressureChart" style="height: 300px;"></div>
    </div>
    <div class="chart-container">
      <div id="flowFSChart" style="height: 300px;"></div>
    </div>
    <div class="chart-container">
      <div id="flowYFChart" style="height: 300px;"></div>
    </div>

    <footer>
      Programa de Ingeniería Civil — Facultad de Arquitectura e Ingeniería<br>
      Universidad de Pamplona — Contacto: (000) 000-0000 / contacto@unipamplona.edu.co
    </footer>
  </div>

  <script>
    // Inicializar elementos de lectura
    const pressureDiv = document.getElementById('pressureReadings');
    for (let i = 0; i < 5; i++) {
      const div = document.createElement('div');
      div.className = 'sensor-card';
      div.id = 'sensor' + i;
      div.innerHTML = `Sensor ${i + 1}: <span id="val${i}">0.00</span> psi`;
      pressureDiv.appendChild(div);
    }

    // Configuración Highcharts oscuro
    Highcharts.setOptions({
      chart: { backgroundColor: '#1e1e1e', style: { color: '#dadada' } },
      xAxis: { labels: { style: { color: '#dadada' } } },
      yAxis: { labels: { style: { color: '#dadada' } }, title: { style: { color: '#dadada' } } },
      legend: { itemStyle: { color: '#dadada' } }
    });

    const pressureChart = Highcharts.chart('pressureChart', {
      title: { text: 'Presiones de los sensores (psi)', style: { color: '#dadada' } },
      yAxis: { title: { text: 'Presión (psi)' } },
      series: Array.from({ length: 5 }, (_, i) => ({ name: `Sensor ${i + 1}`, data: [] }))
    });

    const flowFSChart = Highcharts.chart('flowFSChart', {
      title: { text: 'Caudal FS300A (L/h)', style: { color: '#dadada' } },
      yAxis: { title: { text: 'Flujo (L/h)' } },
      series: [{ name: 'FS300A', data: [] }]
    });

    const flowYFChart = Highcharts.chart('flowYFChart', {
      title: { text: 'Caudal YF-S201 (L/min)', style: { color: '#dadada' } },
      yAxis: { title: { text: 'Flujo (L/min)' } },
      series: [{ name: 'YF-S201', data: [] }]
    });

    async function fetchData() {
      const res = await fetch('/pressure');
      const data = await res.json();

      for (let i = 0; i < 5; i++) {
        document.getElementById('val' + i).innerText = data['p' + (i + 1)].toFixed(2);
        const t = (new Date()).getTime();
        pressureChart.series[i].addPoint([t, data['p' + (i + 1)]], true, pressureChart.series[i].data.length > 20);
      }

      document.getElementById('flowFS').innerText = 'Caudal FS300A: ' + data.flowFS.toFixed(2) + ' L/h';
      document.getElementById('flowYF').innerText = 'Caudal YF-S201: ' + data.flowYF.toFixed(2) + ' L/min';

      const t = (new Date()).getTime();
      flowFSChart.series[0].addPoint([t, data.flowFS], true, flowFSChart.series[0].data.length > 20);
      flowYFChart.series[0].addPoint([t, data.flowYF], true, flowYFChart.series[0].data.length > 20);
    }

    async function downloadCSV() {
      const res = await fetch('/data');
      const csv = await res.text();
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'datos_monitoreo.csv';
      a.click();
    }

    setInterval(fetchData, 2000);

    function calibrateSensors() {
    fetch('/calibrate')
        .then(r => r.text())
        .then(t => alert("Calibración completada"));
}

  </script>
</body>
</html>
